# Data manifest — single source of truth for every file the figures need.
# Each entry maps a Drive ID or local repo path to a local target under data/.
# Re-running 00_pull_drive_data.ipynb fetches anything missing or stale.
#
# Fields:
#   name:          slug used in notebooks (data["name"])
#   source:        drive | local
#   drive_id:      Google Drive file ID (if source == drive)
#   local_source:  path relative to repo root (if source == local)
#   local_path:    target under thesis_figures/data/
#   size_bytes:    expected size for integrity check
#   consumed_by:   list of figure/table IDs that read this file

datasets:
  # ---------- Drive: small CSV/JSON (committed) ----------
  - name: exp21_summary
    source: drive
    drive_id: 1HvOHWsty3an2XJtEOUzj7w3s1lP31o2l
    local_path: data/raw/exp21_summary.csv
    size_bytes: 1023
    consumed_by: [table_4_7, fig_4_11]

  - name: exp21_all_metrics
